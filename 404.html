<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>404 — Página no encontrada · Alex Martínez</title>
  <meta name="description" content="Error 404 — El archivo solicitado no está disponible. Volver al escritorio." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://gambito700.github.io/" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
      background: #0a0a14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    /* Animated background particles */
    .bg-particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(0, 212, 255, 0.15);
      border-radius: 50%;
      animation: float linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
    .particle:nth-child(1) { left: 10%; width: 6px; height: 6px; animation-duration: 12s; animation-delay: 0s; }
    .particle:nth-child(2) { left: 25%; width: 3px; height: 3px; animation-duration: 18s; animation-delay: 2s; }
    .particle:nth-child(3) { left: 40%; width: 5px; height: 5px; animation-duration: 14s; animation-delay: 4s; }
    .particle:nth-child(4) { left: 55%; width: 4px; height: 4px; animation-duration: 16s; animation-delay: 1s; }
    .particle:nth-child(5) { left: 70%; width: 7px; height: 7px; animation-duration: 20s; animation-delay: 3s; }
    .particle:nth-child(6) { left: 85%; width: 3px; height: 3px; animation-duration: 13s; animation-delay: 5s; }
    .particle:nth-child(7) { left: 50%; width: 5px; height: 5px; animation-duration: 15s; animation-delay: 0s; }
    .particle:nth-child(8) { left: 15%; width: 4px; height: 4px; animation-duration: 11s; animation-delay: 6s; }
    .particle:nth-child(9) { left: 65%; width: 6px; height: 6px; animation-duration: 17s; animation-delay: 2s; }
    .particle:nth-child(10) { left: 35%; width: 3px; height: 3px; animation-duration: 19s; animation-delay: 4s; }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem;
      max-width: 520px;
      width: 100%;
    }
    .window {
      background: rgba(28, 28, 36, 0.92);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 3rem 2.5rem 2.5rem;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }
    .window::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3), transparent);
    }
    /* Window title bar simulation */
    .win-title-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      position: absolute;
      top: 14px;
      left: 18px;
    }
    .win-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      transition: opacity 0.2s;
    }
    .win-dot.r { background: #ff5f56; }
    .win-dot.y { background: #ffbd2e; }
    .win-dot.g { background: #27c93f; }
    .win-dot.r:hover, .win-dot.y:hover, .win-dot.g:hover { opacity: 0.7; }

    .icon-404 {
      font-size: 4.5rem;
      color: rgba(0, 212, 255, 0.15);
      margin-bottom: 0.5rem;
      line-height: 1;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #00d4ff 0%, #0078d4 50%, #4fc3f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -3px;
      font-family: 'Segoe UI', 'Inter', sans-serif;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 500;
      color: #c0c0c0;
      margin-bottom: 0.4rem;
      letter-spacing: 0.3px;
    }
    p {
      color: #787878;
      font-size: 0.85rem;
      margin-bottom: 2rem;
      line-height: 1.7;
    }
    .progress-wrap {
      margin-bottom: 2rem;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #0078d4, #00d4ff, #4fc3f7);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: fill 3.5s ease-in-out forwards, shimmer 2s linear 0.5s infinite;
    }
    @keyframes fill {
      0% { width: 0; }
      30% { width: 42%; }
      60% { width: 68%; }
      85% { width: 88%; }
      100% { width: 100%; }
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .progress-label {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', 'Consolas', monospace;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.06);
      color: #e0e0e0;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #0078d4;
      border-color: #0078d4;
      color: #fff;
    }
    .btn-primary:hover {
      background: #1a8ad4;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 120, 212, 0.35);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
    .btn i { font-size: 0.9rem; }
    .btn:active { transform: translateY(0); }

    .os-footer {
      margin-top: 1.5rem;
      font-size: 0.6rem;
      color: #3a3a3a;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', 'Consolas', monospace;
    }
    .os-footer span { color: rgba(0, 212, 255, 0.3); }

    @media (prefers-color-scheme: light) {
      body { background: #e8e8f0; }
      .window { background: rgba(245, 245, 250, 0.92); border-color: rgba(0, 0, 0, 0.06); }
      .window::before { background: linear-gradient(90deg, transparent, rgba(0, 120, 212, 0.2), transparent); }
      .error-code { background: linear-gradient(135deg, #0078d4 0%, #0099cc 50%, #0078d4 100%); -webkit-background-clip: text; background-clip: text; }
      h1 { color: #444; }
      p { color: #888; }
      .progress-track { background: rgba(0, 0, 0, 0.06); }
      .btn { background: rgba(0, 0, 0, 0.04); border-color: rgba(0, 0, 0, 0.08); color: #444; }
      .btn-primary { background: #0078d4; color: #fff; }
      .btn-secondary:hover { background: rgba(0, 0, 0, 0.08); }
      .icon-404 { color: rgba(0, 120, 212, 0.12); }
      .os-footer { color: #ccc; }
      .particle { background: rgba(0, 120, 212, 0.1); }
    }
    @media (max-width: 480px) {
      .window { padding: 2.5rem 1.5rem 2rem; border-radius: 12px; margin: 0 8px; }
      .error-code { font-size: 4rem; }
      .icon-404 { font-size: 3rem; }
      .btn { padding: 10px 20px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="bg-particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="container">
    <div class="window">
      <div class="win-title-bar">
        <div class="win-dot r"></div>
        <div class="win-dot y"></div>
        <div class="win-dot g"></div>
      </div>

      <div class="icon-404"><i class="fas fa-map-signs"></i></div>
      <div class="error-code" aria-hidden="true">404</div>
      <h1>Esta p&aacute;gina no est&aacute; disponible</h1>
      <p>El archivo que buscas no existe o fue movido.<br>Te redireccionaremos al escritorio en unos segundos.</p>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <div class="progress-label" id="progressLabel">Iniciando recuperaci&oacute;n...</div>
      </div>

      <div class="btn-group">
        <a href="/" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Volver al Escritorio</a>
        <a href="javascript:history.back()" class="btn btn-secondary"><i class="fas fa-undo"></i> Retroceder</a>
      </div>
    </div>
    <div class="os-footer"><span>◆</span> gambito700.github.io <span>◆</span></div>
  </div>

  <script>
    var label = document.getElementById('progressLabel');
    var steps = [
      'Iniciando recuperaci&oacute;n...',
      'Escaneando rutas disponibles...',
      'Buscando archivo alternativo...',
      'Preparando escritorio...',
      'Listo'
    ];
    var i = 0;
    var interval = setInterval(function () {
      if (i < steps.length) {
        label.textContent = steps[i];
        i++;
      } else {
        clearInterval(interval);
      }
    }, 850);
    setTimeout(function () {
      window.location.href = '/';
    }, 5000);
  </script>
</body>
</html>
